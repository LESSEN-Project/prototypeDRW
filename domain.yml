version: "3.1"

slots:
  begroet:
    type: bool
    initial_value: false
    mappings:
      - type: controlled
  klant_register:
    type: categorical
    values:
      - formeel
      - informeel
    initial_value: informeel
    mappings:
      - type: custom
        action: action_detect_register

  # ---- knowledge-graph flow slots (data/flows.yml, actions/kg_actions.py) ----
  # Filled by the command generator with the customer's own words; the action links them.
  product_categorie:
    type: text
    mappings:
      - type: from_llm
  betaalmethode:
    type: text
    mappings:
      - type: from_llm
  kanaal:
    type: categorical
    values:
      - online
      - winkel
      - beide
    initial_value: beide      # optional argument: the collect step never asks for it
    mappings:
      - type: from_llm
  regio:
    type: text
    mappings:
      - type: from_llm
  dag:
    type: text
    mappings:
      - type: from_llm
  merk:
    type: text
    mappings:
      - type: from_llm
  herkomst:
    type: categorical
    values:
      - hier
      - elders
      - onbekend
    initial_value: onbekend   # optional argument: the collect step never asks for it
    mappings:
      - type: from_llm
  # Added 2026-11-10 for the carries, offers, fact and offers_fit flows.
  dienst:
    type: text
    mappings:
      - type: from_llm
  feit:
    # text, not categorical: a value outside the list in actions/kg_actions.py (FACTS) must reach
    # the action and fall through to search, instead of being rejected and re-asked by the collect step
    type: text
    mappings:
      - type: from_llm
  jeansmodel:
    type: text
    mappings:
      - type: from_llm
  doelgroep:
    type: categorical
    values:
      - dames
      - heren
      - beide
    initial_value: beide      # optional argument: the collect step never asks for it
    mappings:
      - type: from_llm
  # Set by the kg actions: entailed | contradicted | unknown | unlinked, and the source documents.
  kg_verdict:
    type: text
    mappings:
      - type: controlled
  kg_bron:
    type: text
    mappings:
      - type: controlled

actions:
  - action_detect_register
  - action_kg_sells
  - action_kg_accepts
  - action_kg_ships_to
  - action_kg_open_on
  - action_kg_repairs
  - action_kg_carries
  - action_kg_offers
  - action_kg_fact
  - action_kg_offers_fit

responses:
  utter_begroeting:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Goedendag! Ik ben de digitale assistent van De Rode Winkel. U kunt mij vragen stellen over de winkel en openingstijden, bestellen, bezorgen, retourneren, betalen, maten en reparaties. Waarmee kan ik u helpen?"
    - text: "Hallo! Ik ben de digitale assistent van De Rode Winkel. Je kunt me vragen stellen over de winkel en openingstijden, bestellen, bezorgen, retourneren, betalen, maten en reparaties. Waar kan ik je mee helpen?"

  utter_cannot_help:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Daar kan ik u helaas niet mee helpen. Neemt u contact op via telefoon (030 233 63 03) of e-mail (info@derodewinkel.nl)."
    - text: "Daar kan ik je helaas niet mee helpen. Neem contact op via telefoon (030 233 63 03) of e-mail (info@derodewinkel.nl)."

  utter_cannot_handle:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Daar kan ik u helaas niet mee helpen. Neemt u contact op via telefoon (030 233 63 03) of e-mail (info@derodewinkel.nl)."
    - text: "Daar kan ik je helaas niet mee helpen. Neem contact op via telefoon (030 233 63 03) of e-mail (info@derodewinkel.nl)."

  utter_flow_cancelled:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Oké, ik heb dat geannuleerd. Kan ik u nog ergens anders mee helpen?"
    - text: "Oké, ik heb dat geannuleerd. Kan ik je nog ergens anders mee helpen?"

  utter_internal_error_rasa:
    - text: "Er is een technisch probleem opgetreden. Probeer het over een paar minuten opnieuw."

  utter_user_input_empty_error_rasa:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Ik heb een leeg bericht ontvangen. Waarmee kan ik u helpen?"
    - text: "Ik heb een leeg bericht ontvangen. Waarmee kan ik je helpen?"

  utter_no_relevant_answer_found:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Daar kan ik u helaas niet mee helpen. Neemt u contact op via telefoon (030 233 63 03) of e-mail (info@derodewinkel.nl)."
    - text: "Daar kan ik je helaas niet mee helpen. Neem contact op via telefoon (030 233 63 03) of e-mail (info@derodewinkel.nl)."

  utter_ask_rephrase:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Dat heb ik niet goed begrepen. Kunt u het op een andere manier omschrijven?"
    - text: "Dat heb ik niet goed begrepen. Kun je het op een andere manier omschrijven?"

  utter_completed:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Kan ik u nog ergens anders mee helpen?"
    - text: "Kan ik je nog ergens anders mee helpen?"

  # ---- collect steps of the knowledge-graph flows ----
  utter_ask_product_categorie:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Naar welk soort product bent u op zoek?"
    - text: "Naar welk soort product ben je op zoek?"
  utter_ask_betaalmethode:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Met welke betaalmethode wilt u betalen?"
    - text: "Met welke betaalmethode wil je betalen?"
  utter_ask_kanaal:   # never asked: the slot has an initial value
    - text: "Gaat het om de webshop of om de winkel?"
  utter_ask_regio:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Naar welk land of welke plaats wilt u de bestelling laten bezorgen?"
    - text: "Naar welk land of welke plaats wil je de bestelling laten bezorgen?"
  utter_ask_dag:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Over welke dag wilt u de openingstijden weten?"
    - text: "Over welke dag wil je de openingstijden weten?"
  utter_ask_merk:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Van welk merk is het kledingstuk?"
    - text: "Van welk merk is het kledingstuk?"
  utter_ask_herkomst:   # never asked: the slot has an initial value
    - text: "Is het artikel bij De Rode Winkel gekocht of ergens anders?"
  utter_ask_dienst:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Over welke dienst of regeling wilt u iets weten?"
    - text: "Over welke dienst of regeling wil je iets weten?"
  utter_ask_feit:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Welk gegeven wilt u precies weten?"
    - text: "Welk gegeven wil je precies weten?"
  utter_ask_jeansmodel:
    - condition:
        - type: slot
          name: klant_register
          value: formeel
      text: "Naar welk jeansmodel bent u op zoek?"
    - text: "Naar welk jeansmodel ben je op zoek?"
  utter_ask_doelgroep:   # never asked: the slot has an initial value
    - text: "Voor dames of voor heren?"
