flows:
  pattern_cancel_flow:
    description: Overrides the default cancel flow response in Dutch
    steps:
      - action: utter_flow_cancelled

  pattern_completed:
    description: Ask whether there is anything else, except right after the greeting
    steps:
      - noop: true
        next:
          - if: slots.begroet
            then:
              - set_slots:
                  - begroet: false
                next: END
          - else:
              - action: utter_completed
                next: END

  pattern_search:
    description: Flow for handling knowledge-based questions
    name: pattern search
    steps:
      - action: action_detect_register
      - action: action_trigger_search
