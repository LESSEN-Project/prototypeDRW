flows:
  begroeting:
    description: De gebruiker begroet alleen (hallo, hoi, hey, goedemorgen, goedemiddag) zonder een vraag te stellen.
    name: begroeting
    persisted_slots:
      - begroet
    steps:
      - action: utter_begroeting
      - set_slots:
          - begroet: true

  # ---- knowledge-graph flows: one per query template in experiments/kg/query.py ----
  # The command generator starts the flow and fills the slots with the customer's own
  # words; the action links them to the vocabulary, runs the template and answers. When
  # the graph does not settle the question (unknown, or a word that links to nothing),
  # the flow falls through to retrieval over docs/ (action_trigger_search).

  kg_assortiment:
    description: De klant vraagt of De Rode Winkel een bepaald soort product verkoopt (bijvoorbeeld jeans, sneakers, hoodies, wasmachines, kinderkleding).
    name: assortiment
    steps:
      - action: action_detect_register
      - collect: product_categorie
        description: Het soort product waar de klant naar vraagt, in de woorden van de klant (bijvoorbeeld "sneakers", "een hoodie", "wasmachines").
      - action: action_kg_sells
        next:
          - if: slots.kg_verdict == "entailed" or slots.kg_verdict == "contradicted"
            then: END
          - else:
              - action: action_trigger_search
                next: END

  kg_betaalmethode:
    description: De klant vraagt of een bepaalde betaalmethode mogelijk is (bijvoorbeeld iDEAL, Bancontact, Klarna, PayPal, achteraf betalen, in termijnen, contant, pinnen, cadeaukaart), eventueel specifiek online of in de winkel.
    name: betaalmethode
    steps:
      - action: action_detect_register
      - collect: betaalmethode
        description: De betaalmethode waar de klant naar vraagt, in de woorden van de klant (bijvoorbeeld "Bancontact", "in termijnen", "achteraf betalen").
      - collect: kanaal
        description: Alleen als de klant het noemt. "online" voor de webshop, "winkel" voor de fysieke winkel. Anders niet zetten.
      - action: action_kg_accepts
        next:
          - if: slots.kg_verdict == "entailed" or slots.kg_verdict == "contradicted"
            then: END
          - else:
              - action: action_trigger_search
                next: END

  kg_bezorging:
    description: De klant vraagt of De Rode Winkel bezorgt of verzendt naar een bepaald land, een bepaalde regio of een bepaalde stad (bijvoorbeeld België, Antwerpen, Duitsland).
    name: bezorging
    steps:
      - action: action_detect_register
      - collect: regio
        description: Het land, de regio of de stad waar de klant naar vraagt (bijvoorbeeld "België", "Antwerpen").
      - action: action_kg_ships_to
        next:
          - if: slots.kg_verdict == "entailed" or slots.kg_verdict == "contradicted"
            then: END
          - else:
              - action: action_trigger_search
                next: END

  kg_openingstijden:
    description: De klant vraagt of de winkel op een bepaalde dag open is, of tot hoe laat (bijvoorbeeld zondag, donderdag, koopavond, Koningsdag).
    name: openingstijden
    steps:
      - action: action_detect_register
      - collect: dag
        description: De dag waar de klant naar vraagt (bijvoorbeeld "zondag", "koopavond", "Koningsdag").
      - action: action_kg_open_on
        next:
          - if: slots.kg_verdict == "entailed" or slots.kg_verdict == "contradicted"
            then: END
          - else:
              - action: action_trigger_search
                next: END

  kg_reparatie:
    description: De klant vraagt of De Rode Winkel een kledingstuk van een bepaald merk kan repareren of vermaken (bijvoorbeeld een Levi's, een Nudie), eventueel een artikel dat elders is gekocht.
    name: reparatie
    steps:
      - action: action_detect_register
      - collect: merk
        description: Het merk van het kledingstuk, in de woorden van de klant (bijvoorbeeld "Levi's", "Nudie").
      - collect: herkomst
        description: Alleen als de klant het noemt. "elders" als het artikel ergens anders is gekocht, "hier" als het bij De Rode Winkel is gekocht. Anders niet zetten.
      - action: action_kg_repairs
        next:
          - if: slots.kg_verdict == "entailed" or slots.kg_verdict == "contradicted"
            then: END
          - else:
              - action: action_trigger_search
                next: END

  # ---- added 2026-11-10: carries, offers, fact and offers_fit as flows ----

  kg_merk:
    description: De klant vraagt of De Rode Winkel een bepaald merk voert of verkoopt (bijvoorbeeld Levi's, Nudie, G-Star, Carhartt, Zara).
    name: merk
    steps:
      - action: action_detect_register
      - collect: merk
        description: Het merk waar de klant naar vraagt, in de woorden van de klant (bijvoorbeeld "Levi's", "Carhartt").
      - action: action_kg_carries
        next:
          - if: slots.kg_verdict == "entailed" or slots.kg_verdict == "contradicted"
            then: END
          - else:
              - action: action_trigger_search
                next: END

  kg_dienst:
    description: De klant vraagt of een bepaalde dienst of regeling bestaat, of hoe die werkt (bijvoorbeeld reserveren, paskamer reserveren, kortingscode, spaarpunten, member worden, ruilen, retour, klacht indienen, nabestellen, cadeaukaart, Click & Collect, probleem met de bezorging, studentenkorting).
    name: dienst
    steps:
      - action: action_detect_register
      - collect: dienst
        description: De dienst of regeling waar de klant naar vraagt, in de woorden van de klant (bijvoorbeeld "reserveren", "kortingscode", "punten inzetten", "klacht indienen").
      - action: action_kg_offers
        next:
          - if: slots.kg_verdict == "entailed" or slots.kg_verdict == "contradicted"
            then: END
          - else:
              - action: action_trigger_search
                next: END

  kg_feit:
    description: De klant vraagt naar een enkel feit over De Rode Winkel, zoals het adres, de postcode, het telefoonnummer, het e-mailadres, wie bezorgt, de verzendkosten, vanaf welk bedrag verzending gratis is, de levertijd, de retourkosten, de retourtermijn, wanneer het geld terug is, de garantie op jeans, de reactietermijn op klachten, het oprichtingsjaar, het spaarpercentage, de studentenkorting, de PayPal-toeslag, of een account verplicht is, of sale-artikelen nabesteld kunnen worden.
    name: feit
    steps:
      - action: action_detect_register
      - collect: feit
        description: Welk feit de klant wil weten, als een van de toegestane waarden.
      - action: action_kg_fact
        next:
          - if: slots.kg_verdict == "entailed" or slots.kg_verdict == "contradicted"
            then: END
          - else:
              - action: action_trigger_search
                next: END

  kg_jeansmodel:
    description: De klant vraagt of De Rode Winkel een bepaald jeansmodel of een bepaalde pasvorm heeft (bijvoorbeeld bootcut, skinny, mom jeans, straight fit, wide leg), eventueel voor dames of voor heren.
    name: jeansmodel
    steps:
      - action: action_detect_register
      - collect: jeansmodel
        description: Het jeansmodel of de pasvorm waar de klant naar vraagt, in de woorden van de klant (bijvoorbeeld "bootcut", "mom jeans").
      - collect: doelgroep
        description: Alleen als de klant het noemt. "dames" of "heren". Anders niet zetten.
      - action: action_kg_offers_fit
        next:
          - if: slots.kg_verdict == "entailed" or slots.kg_verdict == "contradicted"
            then: END
          - else:
              - action: action_trigger_search
                next: END
