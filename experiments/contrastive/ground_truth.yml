A | bedrijfsgegevens - leeftijd van de zaak | v1: De Rode Winkel is opgericht op 19 maart 1837 door Johannes Broekman en Annaatje van Essenberg als kleermakerij en winkel in fournituren. Het bedrijf bestaat dus al sinds 1837 en de continuïteit bestaat tot vandaag. Na het overlijden van Johannes zette Annaatje de zaak voort als Weduwe Johannes Broekman. In 2017 is het familiebedrijf overgegaan naar de zesde generatie. In 2012 ontving De Rode Winkel het predicaat Hofleverancier. Het uitgangspunt van De Rode Winkel is betekenisvol ondernemen, vertaald naar betrouwbaar zijn en lange termijn denken, met duurzame relaties met klanten en leveranciers.
