A | producten - milieuvriendelijk | v1: De Rode Winkel selecteert merken zorgvuldig op duurzaamheid en stelt hogere inkoopeisen; recent toegevoegde merken richten zich op duurzame productie. De winkel werkt uitsluitend met transparante merken die duurzaamheidseisen nakomen, zoals Kuyichi, Nudie Jeans en MUD Jeans, die hun productiefaciliteiten publiceren. Duurzame producten zijn herkenbaar aan het groene blad-icoontje in de webshop en gebruiken duurzame materialen zoals GOTS-katoen. Geen enkele spijkerbroek is volledig duurzaam, maar dit zijn de minst belastende alternatieven. Volgens onderzoek van Impact Institute en ABN AMRO zou een spijkerbroek €33 meer moeten kosten als alle verborgen milieu- en sociale kosten (waterverontreiniging, katoenteelt, kinderarbeid, onderbetaling, onveilige omstandigheden) worden meegeteld. De productie van één kilogram jeansstof kost 10.000 liter water, jaarlijks wordt 92 miljoen ton kleding weggegooid waarvan minder dan 1% wordt gerecycled, en de mode-industrie
  is verantwoordelijk voor 10% van de wereldwijde CO2-uitstoot.
