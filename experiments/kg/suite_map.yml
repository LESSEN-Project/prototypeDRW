# Hand-made mapping from the 124-case suite (tests/test_contrastive_suite.yml) to
# query templates in query.py. Keyed by the case name without the "| v1"/"| v2"
# paraphrase suffix, so both paraphrases of an answerable question share one entry.
# This mapping stands in for entity linking + template routing, which the runtime
# bot will have to do itself (skos:altLabel in vocab.ttl is the material for that).
#
# expect: the verdict the knowledge base supports, decided by reading the documents:
#   A cases -> entailed, or contradicted for "(negative answer)" cases
#   N cases -> unknown (fact absent), or contradicted when a complete list rules it out
#   O cases -> no template: nothing in the question links to the graph -> unknown
# link_note records where the mapping itself is a judgement call.

# ---- answerable ------------------------------------------------------------
"A | assortiment - jassen":                {template: sells, args: {category: d:Outerwear}, expect: entailed}
"A | assortiment - kinderkleding":         {template: sells, args: {category: d:KidsClothing}, expect: entailed}
"A | assortiment - laptops (negative answer)": {template: sells, args: {category: d:Laptops}, expect: contradicted}
"A | assortiment - merken":                {template: list_brands, args: {}, expect: entailed,
                                            link_note: "v2 asks for Levi's specifically: carries(d:Levis) is also entailed"}
