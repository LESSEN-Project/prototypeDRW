# Knowledge-graph flows (data/flows.yml, actions/kg_actions.py): the eleven questions of
# the 2026-09-29 demo (experiments/kg/demo.py), asked to the bot instead of to demo.py.
# Each case asserts that the command generator started the right flow and filled the
# slot with the customer's words, and that the answer carries the verdict the graph gives.
#
# Case names: "KG-E |" entailed, "KG-C |" contradicted, "KG-U |" unknown (the graph
# says nothing and the flow falls through to retrieval), "RAG |" outside the five shapes.
#
#   rasa test e2e tests/test_kg_flows.yml

test_cases:
# ---- sells ---------------------------------------------------------------------------
- test_case: KG-E | assortiment - jeans
  steps:
  - user: Verkopen jullie jeans?
    assertions:
    - flow_started: kg_assortiment
    - slot_was_set:
      - name: kg_verdict
        value: entailed
    - bot_uttered:
        text_matches: ^Ja, jeans verkopen we\.
- test_case: KG-C | assortiment - sneakers (inferred from doesNotSell Shoes)
  steps:
  - user: Verkopen jullie sneakers?
    assertions:
    - flow_started: kg_assortiment
    - slot_was_set:
      - name: kg_verdict
        value: contradicted
    - bot_uttered:
        text_matches: ^Nee, sneakers verkopen we niet\.
- test_case: KG-C | assortiment - wasmachines (top-level completeness)
  steps:
  - user: Verkopen jullie wasmachines?
    assertions:
    - flow_started: kg_assortiment
    - slot_was_set:
      - name: kg_verdict
        value: contradicted
    - bot_uttered:
        text_matches: ^Nee, wasmachines verkopen we niet\.
- test_case: KG-U | assortiment - hoodies (clothing list is open)
  steps:
  - user: Verkopen jullie hoodies?
    assertions:
    - flow_started: kg_assortiment
    - slot_was_set:
      - name: kg_verdict
        value: unknown
    - bot_did_not_utter:
        text_matches: kennisgraaf
    - bot_did_not_utter:
        utter_name: utter_internal_error_rasa

