# Retrieval stress test: every query is deliberately worded differently from
# the knowledge base text (synonyms, colloquial Dutch) to verify that
# enterprise search retrieves on meaning rather than exact vocabulary.
# One test case per knowledge base category, plus abstention checks.
#
# Eight of the questions have the shape of a knowledge-graph flow (data/flows.yml) and
# are answered from the graph with a template sentence instead of by enterprise search;
# those cases assert the flow and the sentence. Four were rewritten on 2026-11-10 and
# four on 2026-11-11, after the flows for brands, services, facts and jeans models were
# added. Two more questions are captured by a graph flow with a worse answer than
# retrieval gave; they are marked KNOWN FAILURE below.
#
# Run with the SSH tunnel to the Ollama server open:
#   rasa test e2e tests/test_retrieval_stress.yml

test_cases:
  - test_case: retouren - terugsturen kosten (colloquial for retourkosten)
    steps:
      - user: "Wat kost het om iets terug te sturen?"
        assertions:   # answered from the graph since 2026-11-10: the return fee fact
          - flow_started: kg_feit
          - slot_was_set:
              - name: kg_verdict
                value: entailed
          - bot_uttered:
              text_matches: ^De retourkosten per post zijn 7 euro\.

  - test_case: verzending - gratis verzending drempel
    steps:
      - user: "Vanaf welk bedrag hoef ik geen verzendkosten te betalen?"
        assertions:   # answered from the graph since 2026-11-10: the free-shipping threshold
          - flow_started: kg_feit
          - slot_was_set:
              - name: kg_verdict
                value: entailed
          - bot_uttered:
              text_matches: ^Vanaf 49 euro is de verzending gratis\.

  - test_case: verzending - bezorging Belgie (previously missed in English)
    steps:
      - user: "Bezorgen jullie ook in België?"
        assertions:   # answered from the graph: shipsTo Europe, Belgium partOf Europe
          - flow_started: kg_bezorging
          - slot_was_set:
              - name: kg_verdict
                value: entailed
          - bot_uttered:
              text_matches: ^Ja, we bezorgen in België\.

  - test_case: bestellen - account verplicht
    steps:
      - user: "Moet ik verplicht een account hebben om iets te kopen?"
        assertions:   # answered from the graph since 2026-11-10: requiresAccount false
          - flow_started: kg_feit
          - slot_was_set:
              - name: kg_verdict
                value: entailed
          - bot_uttered:
              text_matches: ^Nee, bestellen kan ook zonder account\.

  - test_case: betalen - achteraf betalen (colloquial for Billink)
    steps:
      - user: "Kan ik m'n bestelling ook achteraf betalen?"
        assertions:   # answered from the graph: "achteraf betalen" is an altLabel of Billink
          - flow_started: kg_betaalmethode
          - slot_was_set:
              - name: kg_verdict
                value: entailed
          - bot_uttered:
              text_matches: ^Ja, online kun je met Billink betalen\.

  # KNOWN FAILURE since the four flows of 2026-11-10 (run of 2026-11-11): the question goes to
  # kg_dienst and gets the terse how-to literal of kortingscode_02, without a yes and without
  # the percentage that retrieval used to give. The assertion below still states what a good
  # answer contains. Left unfixed when the graph line was parked.
  - test_case: kortingscode - studentenkorting
    steps:
      - user: "Krijg ik korting als student?"
        assertions:
          - generative_response_is_grounded:
              threshold: 0.80
              utter_source: EnterpriseSearchPolicy
              ground_truth: "Studenten ontvangen 10% korting. In de winkel toon je je studentenpas; online vul je een formulier in waarna je een kortingscode ontvangt."

  - test_case: cadeaukaart - cadeaubon online gebruiken (synonym cadeaubon)
    steps:
      - user: "Ik heb een cadeaubon gekregen, kan ik die op de site gebruiken?"
        assertions:
          - generative_response_is_grounded:
              threshold: 0.80
              utter_source: EnterpriseSearchPolicy
              ground_truth: "Ja, een cadeaubon is op de site te gebruiken. Fysieke cadeaukaarten kunnen worden omgezet naar een online code door een e-mail te sturen naar info@derodewinkel.nl of een bericht via de WhatsApp-knop onderaan de pagina, met de barcodegegevens. Je krijgt dan een nieuwe code voor de webshop om mee te betalen. De online cadeaukaart voer je in bij het afrekenen na het invullen van je adres."

  - test_case: maatadvies - welke jeans past bij figuur
    steps:
      - user: "Welke spijkerbroek past het beste bij mijn figuur?"
        assertions:
          - generative_response_is_grounded:
              threshold: 0.80
              utter_source: EnterpriseSearchPolicy
              ground_truth: "De winkel helpt door je figuur te analyseren en te bepalen welk jeansmodel bij je lichaamsbouw past. Meer lezen kan via de blog of neem contact op via WhatsApp voor persoonlijk advies. De winkel biedt een uitgebreide maatgids aan en is bereikbaar via meerdere kanalen voor persoonlijk maatadvies."

  - test_case: producten - milieuvriendelijk (synonym for duurzaam)
    steps:
      - user: "Zijn jullie spijkerbroeken een beetje milieuvriendelijk?"
        assertions:
          - generative_response_is_grounded:
              threshold: 0.80
              utter_source: EnterpriseSearchPolicy
              ground_truth: "De Rode Winkel selecteert merken zorgvuldig op duurzaamheid en stelt hogere inkoopeisen; recent toegevoegde merken richten zich op duurzame productie. De winkel werkt uitsluitend met transparante merken die duurzaamheidseisen nakomen, zoals Kuyichi, Nudie Jeans en MUD Jeans, die hun productiefaciliteiten publiceren. Duurzame producten zijn herkenbaar aan het groene blad-icoontje in de webshop en gebruiken duurzame materialen zoals GOTS-katoen. Geen enkele spijkerbroek is volledig duurzaam, maar dit zijn de minst belastende alternatieven. Volgens onderzoek van Impact Institute en ABN AMRO zou een spijkerbroek €33 meer moeten kosten als alle verborgen milieu- en sociale kosten (waterverontreiniging, katoenteelt, kinderarbeid, onderbetaling, onveilige omstandigheden) worden meegeteld. De productie van één kilogram jeansstof kost 10.000 liter water, jaarlijks wordt 92 miljoen ton kleding weggegooid waarvan minder dan 1% wordt gerecycled, en de mode-industrie is verantwoordelijk voor 10% van de wereldwijde CO2-uitstoot."

  - test_case: fysieke winkel - openingstijd donderdag (colloquial)
    steps:
      - user: "Tot hoe laat kan ik donderdag bij jullie terecht?"
        assertions:   # answered from the graph: the Thursday opening-hours node
          - flow_started: kg_openingstijden
          - slot_was_set:
              - name: kg_verdict
                value: entailed
          - bot_uttered:
              text_matches: ^Ja, op donderdag zijn we open van 10:00 tot 21:00 uur\.

  - test_case: garantie - broek stuk na 3 maanden (colloquial, no garantie keyword)
    steps:
      - user: "M'n broek is na drie maanden alweer stuk, wat nu?"
        assertions:
          - generative_response_is_grounded:
              threshold: 0.80
              utter_source: EnterpriseSearchPolicy
              ground_truth: "Op jeans geldt een minimale garantietermijn van 6 maanden. Een broek die na drie maanden stukgaat valt dus nog binnen de garantietermijn. Je kunt het artikel meenemen naar de winkel voor beoordeling of foto's sturen naar info@derodewinkel.nl als winkelbezoek niet mogelijk is. Je ontvangt binnen 14 dagen een inhoudelijke reactie. De wettelijke garantie geldt voor alle aankopen."

  # KNOWN FAILURE since the four flows of 2026-11-10 (run of 2026-11-11): the question asks how
  # much the points are worth; the generator starts kg_dienst with a slot value copied from the
  # prompt's service list, and the bot explains where to redeem points. Right entity, wrong
  # question. The assertion below still states what a good answer contains. Left unfixed when
  # the graph line was parked.
  - test_case: loyaliteitspunten - waarde gespaarde punten
    steps:
      - user: "Hoeveel korting leveren m'n gespaarde punten eigenlijk op?"
        assertions:
          - generative_response_is_grounded:
              threshold: 0.80
              utter_source: EnterpriseSearchPolicy
              ground_truth: "Je spaart 5% van je aankoopbedrag. Voor elke €100 die je besteedt, spaar je €5 korting op je volgende aankoop. Bij het afrekenen staat een sectie met kortingscode, cadeaubon en spaarpunten waar je punten kunt inzetten als korting."

  - test_case: bedrijfsgegevens - leeftijd van de zaak (colloquial)
    steps:
      - user: "Hoe oud is jullie zaak eigenlijk?"
        assertions:   # answered from the graph since 2026-11-10: the founding date, uttered as a raw ISO date
          - flow_started: kg_feit
          - slot_was_set:
              - name: kg_verdict
                value: entailed
          - bot_uttered:
              text_matches: ^De Rode Winkel is opgericht op 1837-03-19\.

  - test_case: abstention - out of scope product
    steps:
      - user: "Verkopen jullie ook wasmachines?"
        assertions:   # a grounded "nee" from the graph (top-level assortment list is complete), no longer an abstention
          - flow_started: kg_assortiment
          - slot_was_set:
              - name: kg_verdict
                value: contradicted
          - bot_uttered:
              text_matches: ^Nee, wasmachines verkopen we niet\.

  - test_case: abstention - unanswerable sizing question (known content gap)
    steps:
      - user: "Valt jullie kleding groot of klein?"
        assertions:
          - bot_uttered:
              utter_name: utter_no_relevant_answer_found
