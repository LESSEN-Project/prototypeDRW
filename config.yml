recipe: default.v1
language: en
assistant_id: mode-reader
pipeline:
- name: SearchReadyLLMCommandGenerator
  llm:
    model_group: ollama_command_llm
  flow_retrieval:
    active: false
  prompt_template: prompts/command_generator.jinja2
policies:
- name: FlowPolicy
- name: EnterpriseSearchPolicy
  llm:
    model_group: ollama_answer_llm
  embeddings:
    model_group: ollama_embeddings
  vector_store:
    type: addons.contrastive_retriever.ContrastiveFAISS
  check_relevancy: true
  max_messages_in_query: 1   # embed only the user's message; the bot's previous line polluted retrieval
  prompt_template: prompts/enterprise_search.jinja2
